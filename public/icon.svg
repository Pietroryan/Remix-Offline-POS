<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2"/>

  <!-- POS Terminal Main Body -->
  <g filter="url(#glow)">
    <!-- Base stand -->
    <path d="M196 380 L316 380 L336 416 L176 416 Z" fill="#334155" rx="8"/>
    <rect x="226" y="340" width="60" height="44" fill="#475569" rx="4"/>

    <!-- Screen frame -->
    <rect x="120" y="110" width="272" height="236" rx="24" fill="#1e293b" stroke="#334155" stroke-width="6"/>

    <!-- Screen display glass -->
    <rect x="136" y="126" width="240" height="170" rx="14" fill="#0f172a"/>

    <!-- Terminal screen elements -->
    <!-- Status bar -->
    <circle cx="156" cy="144" r="5" fill="#10b981"/>
    <rect x="170" y="141" width="60" height="6" rx="3" fill="#64748b"/>
    <rect x="330" y="141" width="30" height="6" rx="3" fill="#10b981"/>

    <!-- Price big tag -->
    <rect x="156" y="166" width="140" height="28" rx="6" fill="#1e293b"/>
    <text x="164" y="186" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#10b981">Rp 150.000</text>

    <!-- Receipt / Item lines in POS terminal -->
    <rect x="156" y="208" width="200" height="8" rx="4" fill="#475569"/>
    <rect x="156" y="226" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="156" y="244" width="180" height="8" rx="4" fill="#334155"/>
    <rect x="156" y="262" width="120" height="8" rx="4" fill="#334155"/>

    <!-- Terminal card reader slot -->
    <rect x="146" y="310" width="220" height="14" rx="7" fill="#090d16"/>
    <rect x="170" y="314" width="172" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- Green Offline Badge (Lightning / Shield Check) -->
  <g transform="translate(320, 270)">
    <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="#059669" stroke-width="4"/>
    <circle cx="50" cy="50" r="38" fill="url(#primaryGrad)"/>
    <!-- Checkmark icon -->
    <path d="M36 50 L46 60 L66 40" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
